# Puts the app live on Cloudflare every time code lands on main.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Optional secrets GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET enable Google sign-in.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip if Cloudflare key is not set up yet
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set, skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      - name: Create database and photo storage if missing
        if: steps.check.outputs.skip != 'true'
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="photo-competitions-db");process.stdout.write(d?d.uuid:"")')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create photo-competitions-db
            DB_ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));process.stdout.write(l.find(x=>x.name==="photo-competitions-db").uuid)')
          fi
          sed -i "s/REPLACE_WITH_D1_ID/$DB_ID/" wrangler.jsonc
          npx wrangler r2 bucket list | grep -q "photo-competitions-photos" || npx wrangler r2 bucket create photo-competitions-photos

      - name: Update database tables
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 migrations apply photo-competitions-db --remote

      - name: Build and deploy
        if: steps.check.outputs.skip != 'true'
        run: npm run deploy

      - name: Set Google sign-in secrets
        if: steps.check.outputs.skip != 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        if: steps.check.outputs.skip != 'true' && env.GOOGLE_CLIENT_ID != ''
        run: |
          node -e 'process.stdout.write(JSON.stringify({GOOGLE_CLIENT_ID:process.env.GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET:process.env.GOOGLE_CLIENT_SECRET}))' > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json
          rm /tmp/secrets.json
